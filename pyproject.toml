[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gpx2stl"
version = "0.1.0"
description = "Convert GPX routes into printable terrain STL and two-color 3MF models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "gpxpy>=1.6,<2",
    "lib3mf>=2.3,<3",
    "manifold3d>=3,<4",
    "numpy>=1.26,<3",
    "python-dotenv>=1.0,<2",
    "pyproj>=3.6,<4",
    "rasterio>=1.3,<2",
    "requests>=2.31,<3",
    "scipy>=1.11,<2",
    "shapely>=2.0,<3",
    "trimesh>=4.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "responses>=0.25,<1",
]

[project.scripts]
gpx2stl = "gpx2stl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpx2stl"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
